name: Version & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version, Changelog, Tag and Release
        uses: googleapis/release-please-action@v4
        with:
          release-type: "dart"
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
