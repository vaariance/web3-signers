name: web3_signers
description: ERC-1271 and ERC-7739 compatible signature management for passkeys, local keys, and platform keys.
version: 1.0.0
homepage: https://variance.space
repository: https://github.com/vaariance/web3-signers
issue_tracker: https://github.com/vaariance/web3-signers/issues

environment:
  sdk: ^3.7.0
  flutter: ">=3.24.3"

platforms:
  android:
  ios:
  macos:
  windows:
  web:

dependencies:
  passkeys: ^2.17.4
  web3dart: ^3.0.1
  eip712: ^1.0.1
  eip7702: ^1.1.3
  pointycastle: ^4.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  mocktail: ^1.0.4
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  pigeon: ^26.1.5
  flutter_test:
    sdk: flutter

topics:
  - ethereum
  - wallets
  - passkey
  - secure-enclave
